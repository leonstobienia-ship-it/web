[build]
command = "npm run build"
publish = "dist"

[build.environment]
VITE_SITE_URL = "https://www.stobienia.com.br"
VITE_SITE_INDEXABLE = "false"

# Homologação pública em stobienia.com.br: manter noindex.
# Na migração para www.enac.com.br, remover este header ou trocar a estratégia
# junto com VITE_SITE_INDEXABLE=true.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
from = "/supermercados-e-atacados/"
to = "/#atuacao"
status = 301
force = true

