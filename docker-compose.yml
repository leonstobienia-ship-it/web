services:
  postgres:
    image: postgres:16-alpine
    container_name: enac-erp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enac_erp_dev}
      POSTGRES_USER: ${POSTGRES_USER:-enac_erp_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enac_erp_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - enac_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enac_erp_dev} -d ${POSTGRES_DB:-enac_erp_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  enac_erp_postgres_data:
